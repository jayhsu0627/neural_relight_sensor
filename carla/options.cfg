[Demo Parameters]
; Enable/Disable live plotting during the assessment (true/false)
live_plotting = true
; Duration (in seconds) per plot refresh (set to 0 for refreshing every simulation iteration)
live_plotting_period = 0.8
; Enable/Disable synchronous mode with fixed_delta_seconds (true/false)
sync_mode = true
; Fixed simulation time step in seconds (used when sync_mode = true)
fixed_delta_seconds = 0.05
